name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (shellcheck / cppcheck / clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck tests/*.sh

      - name: cppcheck
        run: |
          sudo apt-get update >/dev/null && sudo apt-get install -y cppcheck >/dev/null
          cppcheck --std=c++17 --enable=warning,performance,portability \
            --suppress=missingIncludeSystem --error-exitcode=1 \
            manager model service utils main.cpp

      - name: clang-format 格式门（钉版本 23.1.2，与本地一致）
        run: |
          python3 -m pip install clang-format==23.1.2
          clang-format --dry-run -Werror \
            $(find manager model service utils \( -name '*.h' -o -name '*.cpp' \)) main.cpp

  build-and-test:
    name: Build & Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Check zero warnings
        run: |
          rm -rf build-warncheck && cmake -B build-warncheck -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build-warncheck --config Release -j 2 2>&1 | tee warn-build.log
          # 同时匹配 GCC/Clang（warning:）与 MSVC（warning C####）两种告警格式
          out=$(grep -cE "warning(:| C[0-9]+)" warn-build.log || true)
          echo "warning count = $out"
          if [ "$out" -ne 0 ]; then
            echo "::error::编译告警未清零（$out 条）"
            exit 1
          fi

      - name: Run full-flow regression tests
        run: bash tests/full_flow_test.sh
